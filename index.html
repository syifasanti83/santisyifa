<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sipsan Toko - Login</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;margin:0;background:#fffdf7;color:#4a3f35}
.wrapper{max-width:900px;margin:60px auto;padding:0 16px}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center}
.auth-card{background:#fffaf0;border:1px solid #f5e6cc;border-radius:20px;padding:40px;width:360px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.auth-card h2{margin:0 0 16px;text-align:center;color:#4a3f35}
.auth-card p{text-align:center;color:#7a5c3e;margin-bottom:24px}
.input-group{margin-bottom:16px}
.input-group label{display:block;margin-bottom:6px;font-size:14px;color:#4a3f35}
.auth-card input[type=text], .auth-card input[type=password]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #eadfc8;background:#fff;font-size:15px}
.auth-card button{width:100%;background:#4a3f35;color:#fff8e7;border:0;border-radius:12px;padding:12px;font-weight:700;margin-top:12px}
.auth-card button:hover{background:#c9a86a}
.error{background:#fff0f0;border:1px solid #f5e6cc;color:#c92a2a;padding:10px;border-radius:10px;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="wrapper">
  <div class="auth-page">
    <div class="auth-card">
      <h2>Login Admin</h2>
      <p>Masuk untuk mengakses pengaturan toko</p>
      <form id="loginForm">
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="username" required />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit">Masuk</button>
      </form>
      <div id="errorMsg" class="error" style="display:none;">Username atau password salah</div>
    </div>
  </div>
</div>

<script>
// Sederhana: Hardcoded credentials (bisa diubah sesuai keinginan)
const CORRECT_USERNAME = "admin";
const CORRECT_PASSWORD = "sipsan2026"; // Ganti dengan password yang kamu mau

const form = document.getElementById("loginForm");
const errorMsg = document.getElementById("errorMsg");

form.addEventListener("submit", function(e){
  e.preventDefault();
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  if(user === CORRECT_USERNAME && pass === CORRECT_PASSWORD){
    // Jika login sukses, simpan status di localStorage dan redirect ke halaman toko
    localStorage.setItem("sipsan_logged_in", "1");
    window.location.href = "toko.html"; // Arahkan ke halaman toko
  } else {
    errorMsg.style.display = "block";
  }
});

// Cek kalau ada session login (jika pengguna refresh halaman)
if(localStorage.getItem("sipsan_logged_in") === "1"){
  // Sudah login, langsung halaman toko
  window.location.href = "toko.html";
}
</script>
</body>
</html>
