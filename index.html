<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sipsan Toko</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto;margin:0;background:#fffdf7;color:#4a3f35}
header{background:#ffffff;color:#4a3f35;padding:28px 16px;text-align:center;border-bottom:3px solid #f5e6cc}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0;opacity:.7}
.search{max-width:520px;margin:-18px auto 0;padding:0 16px}
.search input{width:100%;padding:12px 16px;border-radius:999px;border:1px solid #eadfc8;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding:20px 16px 90px;max-width:900px;margin:0 auto}
.card{background:#fffaf0;border:1px solid #f5e6cc;border-radius:16px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card .img{font-size:40px;background:#f5e6cc;border-radius:12px;padding:10px;margin-bottom:8px;color:#7a5c3e}
.card h3{margin:8px 0 4px;font-size:16px}
.price{color:#8b5e34;font-weight:700;margin:0 0 10px}
.card button{background:#4a3f35;color:#fff8e7;border:0;border-radius:999px;padding:9px 14px;width:100%;font-weight:600}
.card button:active{transform:scale(.97)}
#cart{position:fixed;left:0;right:0;bottom:0;background:#ffffff;color:#4a3f35;border-top:2px solid #f5e6cc;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:center}
#cart button{background:#c9a86a;border:0;color:#fff;border-radius:999px;padding:10px 18px;font-weight:700}
</style>
</head>
<body>
<header><h1>Sipsan Toko</h1><p>Segar, murah, pesan via WhatsApp</p></header>
<div class="search"><input id="q" placeholder="Cari: ayam, susu..." oninput="render()" /></div>
<div class="grid" id="list"></div>
<div id="cart"><span><span id="count">0</span> item | Rp<span id="total">0</span></span><button onclick="checkout()">Checkout WA</button></div>
<script>
const WA_NUMBER = "6280000000000";
const products = [
  {id:1,name:"Kopi Susu",price:15000,icon:"K"},
  {id:2,name:"Teh Manis",price:8000,icon:"T"},
  {id:3,name:"Roti Bakar",price:12000,icon:"R"},
  {id:4,name:"Ayam Bakar",price:18000,icon:"A"},
  {id:5,name:"Susu Coklat",price:6000,icon:"S"},
  {id:6,name:"Susu UHT",price:6000,icon:"U"},
  {id:7,name:"Nobo Oat Milk",price:4000,icon:"O"}
];
let cart = [];
function render(){
  const q=document.getElementById("q").value.toLowerCase();
  const list=document.getElementById("list");
  list.innerHTML="";
  products.filter(p=>p.name.toLowerCase().includes(q)).forEach(p=>{
    const d=document.createElement("div");
    d.className="card";
    d.innerHTML=`<div class="img">${p.icon}</div><h3>${p.name}</h3><p class="price">Rp${p.price.toLocaleString("id-ID")}</p><button onclick="add(${p.id})">+ Keranjang</button>`;
    list.appendChild(d);
  });
}
function add(id){
  cart.push(products.find(p=>p.id===id));
  document.getElementById("count").textContent=cart.length;
  document.getElementById("total").textContent=cart.reduce((s,p)=>s+p.price,0).toLocaleString("id-ID");
}
function checkout(){
  if(!cart.length){alert("Keranjang masih kosong");return}
  const text=encodeURIComponent("Halo Sipsan, saya mau pesan: "+cart.map(p=>p.name).join(", ")+" Total Rp"+cart.reduce((s,p)=>s+p.price,0));
  window.open(`https://wa.me/${WA_NUMBER}?text=${text}`,"_blank");
}
render();
</script>
</body>
</html>
