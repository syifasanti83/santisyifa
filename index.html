
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sipsan Toko</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;margin:0;background:#fffdf7;color:#4a3f35}
header{background:#ffffff;color:#4a3f35;padding:20px 16px;border-bottom:3px solid #f5e6cc}
nav{display:flex;justify-content:center;padding:10px;background:#fffaf0;border-bottom:1px solid #f5e6cc}
nav button{margin:0 5px;padding:8px 12px;border:1px solid #eadfc8;background:#fff;border-radius:999px}
nav button.on{background:#4a3f35;color:#fff;border-color:#4a3f35}
.wrap{max-width:900px;margin:20px auto;padding:0 16px}
.search{margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px}
.card{background:#fffaf0;border:1px solid #f5e6cc;border-radius:15px;padding:20px;text-align:center}
.card .img{background:#f5e6cc;border-radius:10px;padding:10px;margin-bottom:10px;font-size:30px;color:#7a5c3e}
.price{color:#8b5e34;font-weight:bold;margin:10px 0}
.btn{background:#4a3f35;color:#fff;border:none;border-radius:999px;padding:8px 16px;width:100%;font-weight:bold;margin-top:5px}
#cart{position:fixed;bottom: 0;background:#ffffff;color:#4a3f35;border-top:2px solid #f5e6cc;padding:15px;width:100%;display:flex;justify-content:space-between;align-items:center}
#cart button{background:#c9a86a;color:#fff;border:none;border-radius:999x;padding:8px 16px}
</style>
</head>
<body>
<header><h1>Sipsan Toko</h1><p>Putih Cream</h1></header>
<nav>
<button id="b-toko" class="on" onclick="show('toko')">Toko</button>
<button id="b-riwayat" onclick="show('riwayat')">Riwayat</button>
<button id="b-laporan" onclick="show('laporan')">Laporan</button>
<button id="b-kelola" onclick="show('kelola')">Kelola Menu
